[project]
name = "openbb-fmp"
version = "1.6.1+qopenbb.1"
description = "QOpenBB maintained FMP extension: discovery adaptation"
authors = [{name = "OpenBB Team", email = "hello@openbb.co"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = ["openbb-core==2.0.1"]

[project.entry-points."openbb_provider_extension"]
fmp = "openbb_fmp:fmp_provider"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_fmp"]
