name: QOpenBB CodeQL

on:
  pull_request:
    branches: [qopenbb/baseline]
  push:
    branches: [qopenbb/baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out data API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          threads: 2
          config: |
            name: QOpenBB data API and providers
            paths:
              - openbb_platform
            paths-ignore:
              - '**/.venv/**'
              - '**/__pycache__/**'
      - name: Analyze and upload code scanning results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python/qopenbb-data-api
          wait-for-processing: true
